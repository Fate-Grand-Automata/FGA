name: Upload translations to POEditor

on:
  push:
    branches:
      - master
    paths:
      - 'app/src/main/res/values-*/localized.xml'
  workflow_dispatch:

concurrency:
  group: upload-translations
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  upload-translations:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7.0.1

      # Keeps the next POEditor export on top of the current master, so merging it back has no conflicts.
      - name: Reset translations branch to master
        run: git push --force origin HEAD:refs/heads/translations

      - name: Upload translations
        env:
          POEDITOR_API_TOKEN: ${{ secrets.POEDITOR_API_TOKEN }}
          POEDITOR_PROJECT_ID: ${{ secrets.POEDITOR_PROJECT_ID }}
        run: |
          # Resource folder -> POEditor language code
          declare -A languages=(
            [values-b+zh+CN]=zh-CN
            [values-b+zh+TW]=zh-TW
            [values-ja]=ja
            [values-ko]=ko
            [values-vi]=vi
          )

          # Calls a POEditor API endpoint and prints the response; exits on an error response.
          # Call it as a plain assignment (`x=$(poeditor ...)`) so `bash -e` stops the job on failure.
          poeditor() {
            local endpoint=$1
            shift
            local response
            response=$(curl --silent --show-error -X POST "https://api.poeditor.com/v2/$endpoint" \
              -F "api_token=$POEDITOR_API_TOKEN" \
              -F "id=$POEDITOR_PROJECT_ID" \
              "$@")
            if [ "$(echo "$response" | jq -r '.response.status')" != "success" ]; then
              echo "::error::$endpoint failed: $(echo "$response" | jq -c '.response')" >&2
              exit 1
            fi
            echo "$response"
          }

          for folder in "${!languages[@]}"; do
            language="${languages[$folder]}"

            terms=$(poeditor terms/list -F "language=$language")
            echo "$terms" > "$RUNNER_TEMP/terms.json"

            # languages/update applies the fuzzy flag only to translations whose text changes,
            # so only the translations that differ from POEditor are sent.
            python3 .github/scripts/changed_translations.py \
              "app/src/main/res/$folder/localized.xml" "$RUNNER_TEMP/terms.json" > "$RUNNER_TEMP/changed.json"

            echo "Uploading $(jq length "$RUNNER_TEMP/changed.json") changed translations from $folder as fuzzy $language"
            if [ "$(jq length "$RUNNER_TEMP/changed.json")" -gt 0 ]; then
              update=$(poeditor languages/update \
                -F "language=$language" \
                -F "data=<$RUNNER_TEMP/changed.json")
              echo "$update" | jq -c '.result.translations'
            fi
          done
